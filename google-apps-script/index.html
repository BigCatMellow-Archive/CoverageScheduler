<!DOCTYPE html>
<html lang="en">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--panel:#fff;--bg:#f1f5f9;--soft:#f8fafc;--indigo:#6366f1;--green:#059669;--red:#dc2626}
    body{font-family:'Space Grotesk',sans-serif;height:100vh;overflow:hidden;color:var(--ink);background:var(--bg)}

    .brand{display:flex;align-items:center;gap:9px;color:white}.brand-icon{width:28px;height:28px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;display:grid;place-items:center;font-size:13px}.brand h1{font-size:14px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
    .sep{width:1px;height:22px;background:rgba(255,255,255,.1);flex-shrink:0}.date-area{display:flex;align-items:center;gap:8px;flex-shrink:0}.date-input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:white;border-radius:7px;padding:5px 9px;font-size:13px;color-scheme:dark}.day-tag{background:rgba(99,102,241,.22);color:#a5b4fc;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.8px;white-space:nowrap}
    .stats-row{display:flex;gap:6px;flex:1;justify-content:center}.stat{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}.stat .n{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}.s-absent{background:rgba(255,255,255,.07);color:#94a3b8}.s-assigned{background:rgba(5,150,105,.18);color:#34d399}.s-unfilled{background:rgba(220,38,38,.2);color:#f87171}.s-blocks{background:rgba(99,102,241,.15);color:#a5b4fc}
    .top-actions{display:flex;gap:6px;flex-shrink:0}.btn{border-radius:7px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;transition:.14s;border:none;white-space:nowrap}.btn-primary{background:#6366f1;color:white}.btn-primary:hover{background:#4f46e5}.btn-primary:disabled{opacity:.5;cursor:not-allowed}.btn-ghost{background:rgba(255,255,255,.07);color:#cbd5e1;border:1px solid rgba(255,255,255,.1)}.btn-ghost:hover{background:rgba(255,255,255,.13)}

    .layout{display:flex;flex:1;min-height:0;overflow:hidden}.panel{display:flex;flex-direction:column;overflow:hidden}.panel-left{width:288px;min-width:288px;background:white;border-right:1px solid var(--line)}.panel-right{width:272px;min-width:272px;background:white;border-left:1px solid var(--line)}.panel-center{flex:1;background:#f8fafc;min-width:0}
    .pnl-hd{padding:11px 15px 9px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:8px;background:white;flex-shrink:0}.pnl-hd h2,.plan-hd h2{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.9px;flex:1}.pnl-count{font-size:11px;font-weight:600;color:#94a3b8;background:#f1f5f9;padding:2px 7px;border-radius:10px}.pnl-search{padding:7px 12px;background:white;border-bottom:1px solid #f1f5f9}.pnl-search input{width:100%;padding:5px 9px;border:1px solid #e8ecf0;border-radius:6px;font-size:12px;background:#f8fafc;color:#0f172a}.pnl-search input:focus,.fi:focus,.fs:focus{outline:none;border-color:#6366f1}.pnl-scroll{flex:1;overflow-y:auto}
    .abs-row{padding:9px 14px;border-bottom:1px solid #f8fafc;display:flex;align-items:start;gap:8px}.abs-row:hover,.staff-row:hover{background:#fafbfe}.abs-info{flex:1;min-width:0}.abs-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.abs-subj{font-size:11px;color:#94a3b8;margin-top:1px}.abs-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;margin-top:5px}.ab-full{background:#fef2f2;color:#dc2626}.ab-partial{background:#fffbeb;color:#d97706}.ab-emergency{background:#fff1f2;color:#e11d48;border:1px solid #fecdd3}.abs-blocks{font-size:11px;color:#94a3b8;margin-top:3px}.link-btn{border:0;background:none;color:#6366f1;font-size:11px;font-weight:600;cursor:pointer;padding:3px}.add-row{padding:10px 14px}.add-btn{width:100%;padding:8px;border:1.5px dashed #d1d5db;border-radius:7px;background:none;font-size:12px;color:#9ca3af;cursor:pointer}.add-btn:hover{border-color:#6366f1;color:#6366f1;background:#f5f3ff}
    .staff-row{padding:9px 13px;border-bottom:1px solid #f8fafc;display:flex;align-items:center;gap:9px;transition:opacity .18s}.staff-row.off{opacity:.38}.staff-info{flex:1;min-width:0}.staff-name-row{display:flex;align-items:center;gap:5px}.staff-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tier{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;flex-shrink:0}.t1{background:#eef2ff;color:#4f46e5}.t2{background:#ecfeff;color:#0891b2}.t3{background:#faf5ff;color:#7c3aed}.staff-avail{font-size:11px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.staff-assigned{font-size:11px;color:#059669;margin-top:1px;font-weight:500}.tog{position:relative;width:32px;height:17px;flex-shrink:0}.tog input{display:none}.tog-sl{position:absolute;inset:0;background:#d1d5db;border-radius:9px;cursor:pointer;transition:background .18s}.tog-sl:after{content:'';position:absolute;left:2px;top:1.5px;width:14px;height:14px;background:white;border-radius:50%;transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.15)}.tog input:checked+.tog-sl{background:#059669}.tog input:checked+.tog-sl:after{transform:translateX(15px)}
    .plan-hd{padding:11px 17px 9px;background:white;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px;flex-shrink:0}.plan-counts{display:flex;gap:10px;font-size:12px;font-weight:600}.pc-assigned{color:#059669}.pc-unfilled{color:#dc2626}.vtabs{display:flex;gap:1px;background:#f1f5f9;border-radius:7px;padding:3px}.vtab{padding:4px 10px;border:0;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;color:#64748b;background:none}.vtab.on{background:white;color:#0f172a;box-shadow:0 1px 3px rgba(0,0,0,.08)}.plan-body{flex:1;overflow:auto;padding:16px 17px}
    .empty{text-align:center;padding:70px 24px}.empty-ico{font-size:36px;margin-bottom:14px;opacity:.5}.empty h3{font-size:15px;font-weight:600;color:#374151;margin-bottom:8px}.empty p{font-size:13px;color:#9ca3af;line-height:1.65;max-width:320px;margin:0 auto}.spinner{width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}
    .plan-tbl{width:100%;border-collapse:collapse;font-size:12px;background:white;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}.plan-tbl th{text-align:left;padding:9px 12px;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.6px;background:#f8fafc;border-bottom:1px solid #e2e8f0;white-space:nowrap}.plan-tbl td{padding:8px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}.plan-tbl tr:last-child td{border-bottom:0}.plan-tbl tbody tr{cursor:pointer}.plan-tbl tbody tr:hover td{background:#fafbfc}.plan-tbl tr.uf td{background:#fff5f5}.t-mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b;white-space:nowrap}.sp{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:9px;white-space:nowrap}.sp-ok{background:#d1fae5;color:#065f46}.sp-bad{background:#fee2e2;color:#991b1b}
    .tl-axis{position:relative;height:20px;margin:0 0 5px 194px}.tl-tick{position:absolute;transform:translateX(-50%);font-size:10px;color:#94a3b8;font-family:'JetBrains Mono',monospace}.tl-group{margin-bottom:14px}.tl-group-lbl{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.9px;margin-bottom:5px}.tl-row{display:flex;align-items:center;height:38px}.tl-lbl{width:194px;min-width:194px;padding-right:12px}.tl-lbl-name{font-size:11px;font-weight:600;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl-lbl-sub{font-size:10px;color:#94a3b8}.tl-track{flex:1;position:relative;height:28px;background:#f1f5f9;border-radius:5px}.tl-hr{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.06)}.tl-blk{position:absolute;top:2px;height:24px;border-radius:3px;display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:600;cursor:pointer;overflow:hidden;white-space:nowrap;z-index:1}.tl-blk.assigned{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}.tl-blk.unfilled{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}.tl-blk.nocover{background:#f1f5f9;color:#94a3b8;border:1px solid #e2e8f0;cursor:default}
    .sub-card{background:white;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;overflow:hidden}.sub-card-hd{padding:9px 12px;background:#f8fafc;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:8px}.sub-card-hd strong{font-size:12px}.sub-card-hd span{font-size:11px;color:#64748b;margin-left:auto}.sub-row{display:grid;grid-template-columns:130px 1fr 1fr 90px;gap:10px;padding:8px 12px;border-bottom:1px solid #f8fafc;font-size:11px}.sub-row:last-child{border-bottom:0}
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:grid;place-items:center;padding:20px}.hidden{display:none!important}.modal{width:min(520px,95vw);max-height:90vh;overflow:auto;background:white;border-radius:13px;box-shadow:0 24px 60px rgba(15,23,42,.25)}.modal-sm{width:min(440px,95vw)}.m-hd{display:flex;align-items:center;padding:15px 17px;border-bottom:1px solid #e2e8f0}.m-hd h2{font-size:15px;flex:1}.m-x{border:0;background:none;font-size:22px;color:#94a3b8;cursor:pointer}.m-body{padding:16px 17px}.m-ft{display:flex;align-items:center;gap:8px;padding:12px 17px;border-top:1px solid #e2e8f0;background:#f8fafc}.sp-r{flex:1}.fg{margin-bottom:14px}.fl{display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:5px;text-transform:uppercase;letter-spacing:.45px}.fi,.fs{width:100%;border:1px solid #dbe1e8;border-radius:7px;padding:8px 9px;background:white;color:#0f172a;font-size:13px}.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.type-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.t-opt{padding:8px;border:1px solid #dbe1e8;background:white;border-radius:7px;color:#64748b;cursor:pointer;font-size:12px}.t-opt.sel{border-color:#6366f1;background:#eef2ff;color:#4338ca;font-weight:600}.btn-save,.btn-cancel,.btn-del{border:0;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}.btn-save{background:#6366f1;color:white}.btn-cancel{background:white;border:1px solid #dbe1e8;color:#475569}.btn-del{background:#fee2e2;color:#b91c1c}.block-info{padding:10px 11px;background:#f8fafc;border-radius:8px;margin-bottom:14px}.block-info strong{font-size:13px}.block-info div{font-size:11px;color:#64748b;margin-top:3px}
    @media(max-width:950px){body{overflow:auto}.app{height:auto;min-height:100vh}.topbar{height:auto;min-height:54px;flex-wrap:wrap;padding:9px 12px}.stats-row{order:3;width:100%;justify-content:flex-start}.layout{display:block;overflow:visible}.panel-left,.panel-right{width:100%;min-width:0;border:0;border-bottom:1px solid #e2e8f0;max-height:320px}.panel-center{min-height:520px}.top-actions{margin-left:auto}.sep{display:none}}
  </style>
</head>
<body>
<div class="app">
  <div class="topbar"><div class="brand"><div class="brand-icon">◈</div><h1>Coverage Scheduler</h1></div><div class="sep"></div><div class="date-area"><input id="dateInput" type="date" class="date-input"><span id="dayTag" class="day-tag"></span></div><div class="sep"></div><div id="stats" class="stats-row"></div><div class="sep"></div><div class="top-actions"><button id="generateBtn" class="btn btn-primary">Generate Plan</button><button id="saveBtn" class="btn btn-ghost hidden">Save Output</button><button id="handoutBtn" class="btn btn-ghost hidden">Handout</button></div></div>
  <div id="notif" class="notif hidden"></div>
  <div class="layout">
    <section class="panel panel-left"><div class="pnl-hd"><h2>Absent Staff</h2><span id="absenceCount" class="pnl-count">0</span></div><div class="pnl-search"><input id="absenceSearch" placeholder="Search…"></div><div id="absenceList" class="pnl-scroll"></div></section>
    <section class="panel panel-center"><div class="plan-hd"><h2>Coverage Plan</h2><div id="planCounts" class="plan-counts"></div><div class="vtabs"><button class="vtab on" data-view="timeline">Timeline</button><button class="vtab" data-view="table">Table</button><button class="vtab" data-view="subs">By Sub</button></div></div><div id="planBody" class="plan-body"></div></section>
    <section class="panel panel-right"><div class="pnl-hd"><h2>Coverage Staff</h2><span id="coverageCount" class="pnl-count">0</span></div><div class="pnl-search"><input id="coverageSearch" placeholder="Search…"></div><div id="coverageList" class="pnl-scroll"></div></section>
  </div>
</div>
<div id="absenceModal" class="overlay hidden"><div class="modal"><div class="m-hd"><h2 id="absenceModalTitle">Add Absence</h2><button class="m-x" data-close="absenceModal">×</button></div><div class="m-body"><div class="fg"><label class="fl">Staff Member</label><select id="absTeacher" class="fs"></select></div><div class="fg"><label class="fl">Absence Type</label><div class="type-row"><button class="t-opt sel" data-abs-type="Full Day">Full Day</button><button class="t-opt" data-abs-type="Partial Day">Partial Day</button><button class="t-opt" data-abs-type="Emergency">⚡ Emergency</button></div></div><div id="partialTimes" class="f-row hidden"><div class="fg"><label class="fl">Start Time</label><input id="absStart" class="fi" placeholder="e.g. 10:30 AM"></div><div class="fg"><label class="fl">End Time</label><input id="absEnd" class="fi" placeholder="e.g. 3:00 PM"></div></div><div class="fg"><label class="fl">Preferred Coverage</label><select id="absPreferred" class="fs"><option value="">Auto-assign</option></select></div></div><div class="m-ft"><button id="removeAbsBtn" class="btn-del hidden">Remove Absence</button><div class="sp-r"></div><button class="btn-cancel" data-close="absenceModal">Cancel</button><button id="saveAbsBtn" class="btn-save">Save</button></div></div></div>
<div id="blockModal" class="overlay hidden"><div class="modal modal-sm"><div class="m-hd"><h2>Reassign Block</h2><button class="m-x" data-close="blockModal">×</button></div><div class="m-body"><div id="blockInfo" class="block-info"></div><div class="fg"><label class="fl">Assign Coverage To</label><select id="blockCoverage" class="fs"></select></div></div><div class="m-ft"><div class="sp-r"></div><button class="btn-cancel" data-close="blockModal">Cancel</button><button id="saveBlockBtn" class="btn-save">Save Assignment</button></div></div></div>
<script>
const state={date:'',day:'',allStaff:[],coverageStaff:[],absences:[],plan:[],generated:false,generating:false,view:'timeline',editingAbsence:null,editingBlock:null,absenceType:'Full Day'};const dayNames={M:'Monday',T:'Tuesday',W:'Wednesday',R:'Thursday',F:'Friday'};const DS=450,DE=960,DSPAN=DE-DS;
function el(id){return document.getElementById(id)}function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function dayForDate(d){const x=new Date(d+'T12:00:00');return ['U','M','T','W','R','F','S'][x.getDay()]||''}function mins(s){const m=String(s||'').match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);if(!m)return null;let h=+m[1],n=+m[2],p=m[3].toUpperCase();if(p==='PM'&&h!==12)h+=12;if(p==='AM'&&h===12)h=0;return h*60+n}function left(s){const m=mins(s);return m==null?0:Math.max(0,Math.min(100,(m-DS)/DSPAN*100))}function width(s,e){const a=mins(s),b=mins(e);return a==null||b==null?1:Math.max(.5,(b-a)/DSPAN*100)}function teacherFor(name){return state.allStaff.find(t=>t.name===name)}function subjectFor(name){const t=teacherFor(name);if(!t)return'';const values=[...new Set((t.blocks||[]).map(b=>b.subject).filter(s=>s&&!/break|lunch|duty|homeroom/i.test(s)))];return values.slice(0,2).join(' / ')||((t.blocks||[])[0]?.subject||'')}function neededCount(name){const t=teacherFor(name);return t?(t.blocks||[]).filter(b=>b.needsCoverageIfAbsent).length:0}function planId(r,i){return [r.Absent_Staff,r.Start,r.End,i].join('|')}function uiPlan(r,i){return{id:planId(r,i),absent:r.Absent_Staff||'',start:r.Start||'',end:r.End||'',cls:r.Class||'',gr:r.Grade||'',subj:r.Subject||'',rm:r.Room||'',type:r.Assignment_Type||'',coverage:r.Assigned_Coverage||'',mode:r.Coverage_Mode||'',tier:r.Coverage_Tier_Used||'',status:r.Status||'Unfilled',notes:r.Notes||'',raw:r}}function serverRows(){return state.plan.map(p=>p.raw)}function activeCoverage(){return state.coverageStaff.filter(s=>s.activeToday)}
function run(name,arg){return new Promise((resolve,reject)=>{let r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);arg===undefined?r[name]():r[name](arg)})}function errorText(err){return err&&err.message?err.message:String(err||'Unknown error')}function flash(msg,type='ok'){const n=el('notif');n.className='notif '+type;n.innerHTML=`<span>${type==='ok'?'✓':type==='warn'?'⚠':'✗'} ${esc(msg)}</span><button onclick="this.parentElement.classList.add('hidden')">×</button>`;n.classList.remove('hidden');clearTimeout(flash.t);flash.t=setTimeout(()=>n.classList.add('hidden'),5000)}function setBusy(on,label){state.generating=on;const b=el('generateBtn');b.disabled=on;b.textContent=on?(label||'Working…'):(state.generated?'Re-generate':'Generate Plan')}
async function init(){bind();const today=new Date();const local=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);el('dateInput').value=local;await loadDate(local)}function bind(){el('dateInput').addEventListener('change',e=>loadDate(e.target.value));el('absenceSearch').addEventListener('input',renderAbsences);el('coverageSearch').addEventListener('input',renderCoverage);el('generateBtn').addEventListener('click',generatePlan);el('saveBtn').addEventListener('click',saveOutput);el('handoutBtn').addEventListener('click',createHandout);document.querySelectorAll('.vtab').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;document.querySelectorAll('.vtab').forEach(x=>x.classList.toggle('on',x===b));renderPlan()}));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>el(b.dataset.close).classList.add('hidden')));document.querySelectorAll('[data-abs-type]').forEach(b=>b.addEventListener('click',()=>selectAbsenceType(b.dataset.absType)));el('saveAbsBtn').addEventListener('click',saveAbsence);el('removeAbsBtn').addEventListener('click',removeAbsence);el('saveBlockBtn').addEventListener('click',saveBlock);el('absenceModal').addEventListener('click',e=>{if(e.target===el('absenceModal'))el('absenceModal').classList.add('hidden')});el('blockModal').addEventListener('click',e=>{if(e.target===el('blockModal'))el('blockModal').classList.add('hidden')})}
async function loadDate(date){state.date=date;state.day=dayForDate(date);el('dayTag').textContent=state.day?`${state.day} · ${dayNames[state.day]||''}`:'Weekend';state.plan=[];state.generated=false;renderPlan();setBusy(true,'Loading…');try{const data=await run('webGetBootstrap',{date:state.date,day:state.day});state.allStaff=data.allStaff||[];state.coverageStaff=data.allCoverageStaff||[];state.absences=(data.currentAbsences||[]).map(a=>({...a,name:a.staffName}));const rows=(data.currentPreview&&data.currentPreview.rows)||[];state.plan=rows.map(uiPlan);state.generated=state.plan.length>0;renderAll()}catch(e){flash(errorText(e),'err')}finally{setBusy(false)}}function renderAll(){renderAbsences();renderCoverage();renderStats();renderPlan()}function renderStats(){const assigned=state.plan.filter(p=>p.status==='Assigned').length,unfilled=state.plan.filter(p=>p.status!=='Assigned').length;el('stats').innerHTML=`<div class="stat s-absent"><span class="n">${state.absences.length}</span> absent</div>${state.generated?`<div class="stat s-assigned"><span class="n">${assigned}</span> assigned</div>${unfilled?`<div class="stat s-unfilled"><span class="n">${unfilled}</span> unfilled</div>`:''}<div class="stat s-blocks"><span class="n">${state.plan.length}</span> blocks</div>`:''}`;el('planCounts').innerHTML=state.generated?`<span class="pc-assigned">${assigned} assigned</span>${unfilled?`<span class="pc-unfilled">${unfilled} unfilled</span>`:''}`:'';el('saveBtn').classList.toggle('hidden',!state.generated);el('handoutBtn').classList.toggle('hidden',!state.generated)}
function renderAbsences(){const q=el('absenceSearch').value.trim().toLowerCase();const rows=state.absences.filter(a=>a.name.toLowerCase().includes(q)||subjectFor(a.name).toLowerCase().includes(q));el('absenceCount').textContent=state.absences.length;el('absenceList').innerHTML=rows.map(a=>`<div class="abs-row"><div class="abs-info"><div class="abs-name">${esc(a.name)}</div><div class="abs-subj">${esc(subjectFor(a.name))}</div><span class="abs-badge ${a.emergency?'ab-emergency':a.absenceType==='Full Day'?'ab-full':'ab-partial'}">${a.emergency?'⚡ Emergency':esc(a.absenceType)}</span><div class="abs-blocks">${neededCount(a.name)} blocks need coverage</div></div><button class="link-btn" onclick="openAbsence('${encodeURIComponent(a.name)}')">Edit</button></div>`).join('')+`<div class="add-row"><button class="add-btn" onclick="openAbsence('')">+ Add absence</button></div>`}function renderCoverage(){const q=el('coverageSearch').value.trim().toLowerCase();const rows=state.coverageStaff.filter(s=>s.name.toLowerCase().includes(q)||(s.role||'').toLowerCase().includes(q));const active=state.coverageStaff.filter(s=>s.activeToday).length;el('coverageCount').textContent=`${active}/${state.coverageStaff.length} active`;const counts={};state.plan.filter(p=>p.status==='Assigned').forEach(p=>counts[p.coverage]=(counts[p.coverage]||0)+1);el('coverageList').innerHTML=rows.map(s=>`<div class="staff-row ${s.activeToday?'':'off'}"><label class="tog"><input type="checkbox" ${s.activeToday?'checked':''} onchange="toggleCoverage('${encodeURIComponent(s.name)}',this.checked)"><span class="tog-sl"></span></label><div class="staff-info"><div class="staff-name-row"><span class="staff-name">${esc(s.name)}</span><span class="tier t${s.tier||3}">T${s.tier||3}</span></div><div class="staff-avail">${s.activeToday?esc(s.allDay?`All day · ${s.selectedStart||s.defaultStart||''}–${s.selectedEnd||s.defaultEnd||''}`:`${s.selectedStart||s.defaultStart||''}–${s.selectedEnd||s.defaultEnd||''}`):'Not available today'}</div>${counts[s.name]?`<div class="staff-assigned">${counts[s.name]} block${counts[s.name]>1?'s':''} assigned</div>`:''}</div></div>`).join('')||'<div class="empty"><p>No coverage staff configured.</p></div>'}async function toggleCoverage(encoded,available){const name=decodeURIComponent(encoded);try{state.coverageStaff=await run('webToggleCoverageStaff',{name,date:state.date,day:state.day,available});renderCoverage();flash(`${name} ${available?'activated':'deactivated'} for this date.`)}catch(e){flash(errorText(e),'err');await loadDate(state.date)}}
function renderPlan(){if(state.generating){el('planBody').innerHTML='<div class="empty"><div class="spinner"></div><h3>Generating coverage plan…</h3><p>Matching absent blocks to available coverage staff by tier, schedule, availability window, and assignment limits.</p></div>';return}if(!state.generated){el('planBody').innerHTML='<div class="empty"><div class="empty-ico">📋</div><h3>No plan generated yet</h3><p>Add absences, confirm coverage staff availability, then click <strong>Generate Plan</strong>.</p></div>';return}if(state.view==='table')renderTable();else if(state.view==='subs')renderBySub();else renderTimeline()}function renderTable(){el('planBody').innerHTML=`<table class="plan-tbl"><thead><tr><th>Time</th><th>Absent</th><th>Class</th><th>Subject</th><th>Room</th><th>Coverage</th><th>Mode</th><th>Status</th></tr></thead><tbody>${state.plan.map(p=>`<tr class="${p.status==='Assigned'?'':'uf'}" onclick="openBlock('${encodeURIComponent(p.id)}')"><td class="t-mono">${esc(p.start)}–${esc(p.end)}</td><td>${esc(p.absent)}</td><td>${esc(p.cls)}</td><td>${esc(p.subj)}</td><td>${esc(p.rm)}</td><td>${esc(p.coverage||'—')}</td><td>${esc(p.mode||'')}</td><td><span class="sp ${p.status==='Assigned'?'sp-ok':'sp-bad'}">${p.status==='Assigned'?'✓ Assigned':'⚠ Unfilled'}</span></td></tr>`).join('')}</tbody></table>`}function axisHtml(){return `<div class="tl-axis">${[8,9,10,11,12,13,14,15].map(h=>{const label=h<12?h+'a':h===12?'12p':(h-12)+'p';const ts=h<12?`${h}:00 AM`:h===12?'12:00 PM':`${h-12}:00 PM`;return `<span class="tl-tick" style="left:${left(ts)}%">${label}</span>`}).join('')}</div>`}function trackGrid(){return [8,9,10,11,12,13,14,15].map(h=>{const ts=h<12?`${h}:00 AM`:h===12?'12:00 PM':`${h-12}:00 PM`;return `<span class="tl-hr" style="left:${left(ts)}%"></span>`}).join('')}function renderTimeline(){const groups=[...new Set(state.plan.map(p=>p.absent))];let html=axisHtml();groups.forEach(name=>{const teacher=teacherFor(name);const planned=state.plan.filter(p=>p.absent===name);const blocks=(teacher&&teacher.blocks)||[];html+=`<div class="tl-group"><div class="tl-group-lbl">${esc(name)}</div>`;const source=blocks.length?blocks:planned.map(p=>({start:p.start,end:p.end,className:p.cls,subject:p.subj,needsCoverageIfAbsent:true}));source.forEach(b=>{const p=planned.find(x=>x.start===b.start&&x.end===b.end);const klass=p?(p.status==='Assigned'?'assigned':'unfilled'):'nocover';const label=p?(p.coverage||'Unfilled'):(b.className||b.subject||'No coverage');html+=`<div class="tl-row"><div class="tl-lbl"><div class="tl-lbl-name">${esc(b.className||b.subject||'Block')}</div><div class="tl-lbl-sub">${esc(b.start)}–${esc(b.end)}</div></div><div class="tl-track">${trackGrid()}<div class="tl-blk ${klass}" style="left:${left(b.start)}%;width:${width(b.start,b.end)}%" ${p?`onclick="openBlock('${encodeURIComponent(p.id)}')"`:''} title="${esc(label)}">${esc(label)}</div></div></div>`});html+='</div>'});el('planBody').innerHTML=html}function renderBySub(){const assigned=state.plan.filter(p=>p.status==='Assigned'&&p.coverage);const names=[...new Set(assigned.map(p=>p.coverage))].sort();let html=names.map(name=>{const rows=assigned.filter(p=>p.coverage===name).sort((a,b)=>(mins(a.start)||0)-(mins(b.start)||0));return `<div class="sub-card"><div class="sub-card-hd"><strong>${esc(name)}</strong><span>${rows.length} block${rows.length===1?'':'s'}</span></div>${rows.map(p=>`<div class="sub-row" onclick="openBlock('${encodeURIComponent(p.id)}')" style="cursor:pointer"><span class="t-mono">${esc(p.start)}–${esc(p.end)}</span><span>${esc(p.absent)}</span><span>${esc(p.cls)}</span><span>${esc(p.rm)}</span></div>`).join('')}</div>`}).join('');const unfilled=state.plan.filter(p=>p.status!=='Assigned');if(unfilled.length)html+=`<div class="sub-card"><div class="sub-card-hd"><strong style="color:#dc2626">Unfilled</strong><span>${unfilled.length} blocks</span></div>${unfilled.map(p=>`<div class="sub-row" onclick="openBlock('${encodeURIComponent(p.id)}')" style="cursor:pointer"><span class="t-mono">${esc(p.start)}–${esc(p.end)}</span><span>${esc(p.absent)}</span><span>${esc(p.cls)}</span><span>${esc(p.rm)}</span></div>`).join('')}</div>`;el('planBody').innerHTML=html||'<div class="empty"><p>No assignments.</p></div>'}
function openAbsence(encoded){const name=encoded?decodeURIComponent(encoded):'';const current=name?state.absences.find(a=>a.name===name):null;state.editingAbsence=current||null;state.absenceType=current?(current.emergency?'Emergency':current.absenceType):'Full Day';el('absenceModalTitle').textContent=current?`Edit — ${name}`:'Add Absence';const availableNames=new Set(state.absences.map(a=>a.name));el('absTeacher').innerHTML=state.allStaff.filter(t=>current||!availableNames.has(t.name)).map(t=>`<option value="${esc(t.name)}">${esc(t.name)}${subjectFor(t.name)?' — '+esc(subjectFor(t.name)):''}</option>`).join('');el('absTeacher').disabled=!!current;if(current)el('absTeacher').value=name;el('absStart').value=current?.startOverride||'';el('absEnd').value=current?.endOverride||'';el('absPreferred').innerHTML='<option value="">Auto-assign</option>'+activeCoverage().map(s=>`<option value="${esc(s.name)}">${esc(s.name)} (Tier ${s.tier||3})</option>`).join('');el('absPreferred').value=current?.preferredCoverage||'';el('removeAbsBtn').classList.toggle('hidden',!current);selectAbsenceType(state.absenceType);el('absenceModal').classList.remove('hidden')}function selectAbsenceType(type){state.absenceType=type;document.querySelectorAll('[data-abs-type]').forEach(b=>b.classList.toggle('sel',b.dataset.absType===type));el('partialTimes').classList.toggle('hidden',type==='Full Day')}async function saveAbsence(){const name=el('absTeacher').value;if(!name)return;const row={name,staffName:name,absenceType:state.absenceType==='Emergency'?'Full Day':state.absenceType,allDay:state.absenceType==='Full Day'||state.absenceType==='Emergency',emergency:state.absenceType==='Emergency',startOverride:el('absStart').value.trim(),endOverride:el('absEnd').value.trim(),preferredCoverage:el('absPreferred').value};let next=state.absences.filter(a=>a.name!==name);next.push(row);await persistAbsences(next);el('absenceModal').classList.add('hidden')}async function removeAbsence(){if(!state.editingAbsence)return;await persistAbsences(state.absences.filter(a=>a.name!==state.editingAbsence.name));el('absenceModal').classList.add('hidden')}async function persistAbsences(next){try{const result=await run('webSaveAbsences',{date:state.date,day:state.day,absences:next.map(a=>({staffName:a.name||a.staffName,allDay:a.allDay!==undefined?a.allDay:a.absenceType==='Full Day',emergency:!!a.emergency,startOverride:a.startOverride||'',endOverride:a.endOverride||'',preferredCoverage:a.preferredCoverage||'',notes:a.notes||''}))});state.absences=(result||[]).map(a=>({...a,name:a.staffName}));state.plan=[];state.generated=false;renderAll();flash('Absence details saved.')}catch(e){flash(errorText(e),'err')}}
async function generatePlan(){if(!state.absences.length){flash('Add at least one absence first.','warn');return}setBusy(true,'Generating…');state.generating=true;state.plan=[];renderPlan();try{const result=await run('webGenerateCoverage',{date:state.date,day:state.day});state.plan=(result.rows||[]).map(uiPlan);state.generated=true;const s=result.summary||{};flash(`Plan generated — ${s.assignedBlocks||0} assigned, ${s.unfilledBlocks||0} unfilled.`,(s.unfilledBlocks||0)>0?'warn':'ok')}catch(e){flash(errorText(e),'err')}finally{state.generating=false;setBusy(false);renderAll()}}async function saveOutput(){try{const result=await run('webSaveCoverage',serverRows());flash(`Saved ${result.savedRows||state.plan.length} row(s) to Coverage Output.`)}catch(e){flash(errorText(e),'err')}}async function createHandout(){try{await run('webSaveCoverage',serverRows());const result=await run('webCreateHandout');flash(`Handout created: ${result.name||'Google Doc'}`);if(result.url)window.open(result.url,'_blank')}catch(e){flash(errorText(e),'err')}}
function openBlock(encoded){const id=decodeURIComponent(encoded),p=state.plan.find(x=>x.id===id);if(!p)return;state.editingBlock=p;el('blockInfo').innerHTML=`<strong>${esc(p.cls||p.type)} — ${esc(p.absent)}</strong><div>${esc(p.start)} – ${esc(p.end)} · ${esc(p.rm)} · ${esc(p.subj||p.type)}</div><div>${p.status==='Assigned'?'Currently: '+esc(p.coverage):'Currently unfilled'}</div>`;el('blockCoverage').innerHTML='<option value="">— Leave unfilled —</option>'+activeCoverage().map(s=>`<option value="${esc(s.name)}">${esc(s.name)} (Tier ${s.tier||3})</option>`).join('');el('blockCoverage').value=p.coverage||'';el('blockModal').classList.remove('hidden')}function saveBlock(){const p=state.editingBlock;if(!p)return;const coverage=el('blockCoverage').value;p.coverage=coverage;p.status=coverage?'Assigned':'Unfilled';p.mode=coverage?(p.mode||'Manual'):'';p.tier=coverage?(state.coverageStaff.find(s=>s.name===coverage)?.tier||''):'';p.raw.Assigned_Coverage=coverage;p.raw.Status=p.status;p.raw.Coverage_Mode=p.mode;p.raw.Coverage_Tier_Used=String(p.tier||'');el('blockModal').classList.add('hidden');renderAll();flash(coverage?`Block assigned to ${coverage}.`:'Block marked unfilled.','ok')}
document.addEventListener('DOMContentLoaded',init);
</script>
