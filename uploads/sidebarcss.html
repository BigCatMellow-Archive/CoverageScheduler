<style>
  :root {
    --bg: #f6f8fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #d6dbe5;
    --accent: #1f5fbf;
    --accent-soft: #e9f0ff;
    --warn: #9a6700;
    --bad: #b42318;
    --good: #027a48;
  }
  body {
    margin: 0;
    font: 13px/1.4 Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  .app-shell {
    padding: 12px;
  }
  .topbar h1 {
    margin: 0 0 4px;
    font-size: 20px;
  }
  .topbar p {
    margin: 0 0 12px;
    color: var(--muted);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  .grid.two-up {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .field-row,
  .button-row,
  .section-head,
  .summary-grid {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .field-row label {
    display: grid;
    gap: 4px;
    flex: 1;
  }
  .field-row span {
    font-size: 12px;
    color: var(--muted);
  }
  .date-control-row {
    align-items: stretch;
  }
  .derived-day-card {
    min-width: 110px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    padding: 7px 10px;
    display: grid;
    gap: 3px;
    align-content: center;
  }
  .derived-day-card span {
    font-size: 12px;
    color: var(--muted);
  }
  .derived-day-card strong {
    font-size: 14px;
  }
  input, select, button {
    font: inherit;
  }
  input[type="date"], input[type="number"], input[type="text"], select, .search {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  button {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  button.small {
    padding: 6px 10px;
  }
  button.linkish {
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--accent);
    text-align: left;
  }
  .section-head h2 {
    font-size: 16px;
    margin: 0;
    flex: 1;
  }
  .list-block {
    border: 1px solid var(--line);
    border-radius: 8px;
    max-height: 260px;
    overflow: auto;
    background: #fff;
  }
  .list-item {
    padding: 8px 10px;
    border-bottom: 1px solid #eef1f6;
    display: flex;
    gap: 8px;
    align-items: start;
  }
  .list-item:last-child {
    border-bottom: 0;
  }
  .list-item .meta {
    color: var(--muted);
    font-size: 12px;
  }
  .staff-main {
    min-width: 0;
    flex: 1;
  }
  .current-block {
    margin-top: 4px;
    padding: 5px 7px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #f9fbff;
    font-size: 12px;
  }
  .current-class {
    margin-top: 2px;
    font-weight: 700;
  }
  .now-badge {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: #bfd0f5;
  }
  .list-item button {
    margin-left: auto;
    white-space: nowrap;
  }
  .list-item.inactive:not(.coverage-staff-row) {
    opacity: 0.5;
  }
  .list-item .item-actions {
    display: flex;
    gap: 4px;
    margin-left: auto;
    flex-shrink: 0;
    align-items: center;
  }
  .absence-status {
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 11px;
    border: 1px solid var(--line);
    background: #fff;
  }
  .badge.t1 { background: #e7f8ef; color: var(--good); border-color: #a6e0bf; }
  .badge.t2 { background: #fff4df; color: var(--warn); border-color: #f3c970; }
  .badge.t3 { background: #fdecec; color: var(--bad); border-color: #f1a6a6; }
  .badge.off { background: #f3f4f6; color: var(--muted); border-color: var(--line); }
  /* ON/OFF switch */
  .switch-control {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    cursor: pointer;
    user-select: none;
  }
  .switch-control input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }
  .switch-slider {
    position: relative;
    width: 46px;
    height: 24px;
    background: var(--line);
    border-radius: 999px;
    transition: background 0.2s;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
  }
  .switch-slider::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.18);
  }
  .switch-control input:checked + .switch-slider {
    background: var(--good);
  }
  .switch-control input:checked + .switch-slider::after {
    transform: translateX(22px);
  }
  .switch-text {
    min-width: 28px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }
  .switch-text::before {
    content: attr(data-off);
  }
  .switch-control input:checked ~ .switch-text {
    color: var(--good);
  }
  .switch-control input:checked ~ .switch-text::before {
    content: attr(data-on);
  }
  .list-switch {
    margin-top: 2px;
  }
  .switch-setting-row {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    background: #f9fbff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .no-margin {
    margin: 0;
  }
  .coverage-staff-row.inactive .staff-main {
    opacity: 0.62;
  }
  .muted, .hint {
    color: var(--muted);
  }
  .hint {
    margin: 8px 0 0;
    font-size: 12px;
  }
  .status {
    margin-top: 8px;
    min-height: 18px;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .summary-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    background: #fff;
  }
  .summary-card strong {
    display: block;
    font-size: 18px;
  }
  .table-wrap {
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: 8px;
    border-bottom: 1px solid #eef1f6;
    text-align: left;
    vertical-align: top;
    font-size: 12px;
  }
  th {
    position: sticky;
    top: 0;
    background: #f9fbff;
    z-index: 1;
  }
  tr.unfilled td {
    background: #fff8f7;
  }
  .hidden {
    display: none !important;
  }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(17, 24, 39, 0.42);
  }
  .modal {
    width: min(420px, 100%);
    max-height: calc(100vh - 32px);
    overflow: auto;
    box-sizing: border-box;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    padding: 12px;
    box-shadow: 0 18px 40px rgba(17, 24, 39, 0.25);
  }
  .modal-body {
    display: grid;
    gap: 10px;
  }
  .check-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .modal-actions {
    justify-content: flex-end;
    margin-top: 12px;
  }
  @media (max-width: 720px) {
    .grid.two-up,
    .summary-grid {
      grid-template-columns: 1fr;
    }
  }
  .availability-panel {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    background: #f9fbff;
  }
  .override-badge {
    background: #eef2ff;
    color: #3730a3;
    border-color: #c7d2fe;
  }

</style>
